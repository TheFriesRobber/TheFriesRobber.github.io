<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The two-way Provider Adapter boundary</title>
  <desc id="desc">A canonical request passes through two Adapters into provider-native protocols, and responses return as canonical events.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20242b; }
    .title { font-size: 27px; font-weight: 650; }
    .small { font-size: 20px; fill: #4d5665; }
    .canonical { fill: #eef3fb; stroke: #4c76b8; stroke-width: 3; }
    .adapter { fill: #fff2e8; stroke: #bd6b34; stroke-width: 3; }
    .provider { fill: #eef8f0; stroke: #4e875c; stroke-width: 3; }
    .arrow { stroke: #697386; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .bidir { marker-start: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#697386"/>
    </marker>
  </defs>
  <rect x="45" y="165" width="320" height="150" rx="18" class="canonical"/>
  <text x="82" y="218" class="title">Canonical contract</text>
  <text x="92" y="258" class="small">message · tool · call_id</text>
  <text x="105" y="290" class="small">required features</text>
  <rect x="440" y="55" width="275" height="135" rx="18" class="adapter"/>
  <text x="497" y="105" class="title">Adapter A</text>
  <text x="470" y="145" class="small">shape + normalize</text>
  <rect x="440" y="310" width="275" height="135" rx="18" class="adapter"/>
  <text x="497" y="360" class="title">Adapter B</text>
  <text x="470" y="400" class="small">shape + normalize</text>
  <rect x="850" y="55" width="290" height="135" rx="18" class="provider"/>
  <text x="925" y="105" class="title">Provider A</text>
  <text x="900" y="145" class="small">native protocol</text>
  <rect x="850" y="310" width="290" height="135" rx="18" class="provider"/>
  <text x="925" y="360" class="title">Provider B</text>
  <text x="900" y="400" class="small">native protocol</text>
  <path d="M 365 205 C 390 205, 405 122, 440 122" class="arrow bidir"/>
  <path d="M 365 275 C 390 275, 405 377, 440 377" class="arrow bidir"/>
  <path d="M 715 122 L 850 122" class="arrow bidir"/>
  <path d="M 715 377 L 850 377" class="arrow bidir"/>
</svg>
