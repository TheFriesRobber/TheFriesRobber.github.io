<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint recovery flow</title>
  <desc id="desc">Recovery loads a Checkpoint, verifies that its Snapshot covers the cursor, replays events after the cursor, reconciles external side effects with unknown outcomes, and constructs new Runtime state.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#4b5563}.edge{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.box{stroke-width:2}.checkpoint{fill:#eaf2ff;stroke:#4674bd}.event{fill:#f3edff;stroke:#7652b2}.effect{fill:#fff4e8;stroke:#bc6b2c}.runtime{fill:#eef8f1;stroke:#43835a}</style></defs>
  <rect width="960" height="380" rx="18" fill="#fafafa"/><text x="38" y="48" class="title">Checkpoint Starts Recovery; Reconciliation Decides</text><text x="38" y="76" class="small">Do not treat transient objects from the old process as external facts</text>
  <rect x="25" y="142" width="145" height="100" rx="14" class="box checkpoint"/><text x="98" y="181" text-anchor="middle" class="label">Checkpoint</text><text x="98" y="208" text-anchor="middle" class="small">snapshot ref + cursor</text>
  <path d="M170 192H205" class="edge"/><rect x="205" y="142" width="160" height="100" rx="14" class="box checkpoint"/><text x="285" y="181" text-anchor="middle" class="label">Verify Snapshot</text><text x="285" y="208" text-anchor="middle" class="small">state through cursor</text>
  <path d="M365 192H400" class="edge"/><rect x="400" y="142" width="145" height="100" rx="14" class="box event"/><text x="473" y="181" text-anchor="middle" class="label">Replay Events</text><text x="473" y="208" text-anchor="middle" class="small">seq &gt; cursor</text>
  <path d="M545 192H580" class="edge"/><rect x="580" y="132" width="185" height="120" rx="14" class="box effect"/><text x="673" y="174" text-anchor="middle" class="label">Reconcile Effects</text><text x="673" y="202" text-anchor="middle" class="small">query same effect key</text><text x="673" y="228" text-anchor="middle" class="small">confirm or stay unknown</text>
  <path d="M765 192H800" class="edge"/><rect x="800" y="142" width="135" height="100" rx="14" class="box runtime"/><text x="868" y="181" text-anchor="middle" class="label">New State</text><text x="868" y="208" text-anchor="middle" class="small">resume safely</text>
</svg>
