<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle owners for three delegation primitives</title>
  <desc id="desc">The parent Run owns a SubAgent, a durable job system owns a Child Job, and a Workflow Controller manages the branches and join in Workflow Fanout.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#4b5563}.compact{font-size:13px}.box{stroke-width:2}.sub{fill:#eaf2ff;stroke:#4674bd}.task{fill:#eef8f1;stroke:#43835a}.flow{fill:#fff4e8;stroke:#bc6b2c}.inner{fill:#fff;stroke:#9aa0a6}</style>
  <rect width="960" height="430" rx="18" fill="#fafafa"/><text x="38" y="48" class="title">Parallelism Is Not the Boundary; Completion Ownership Is</text><text x="38" y="76" class="small">Lifecycle ownership determines recovery, cancellation, and result joining</text>
  <rect x="38" y="112" width="278" height="270" rx="16" class="box sub"/><text x="177" y="151" text-anchor="middle" class="label">Parent Run</text><rect x="77" y="190" width="200" height="80" rx="12" class="box inner"/><text x="177" y="224" text-anchor="middle" class="label">SubAgent</text><text x="177" y="250" text-anchor="middle" class="small">follows parent lifecycle</text>
  <rect x="341" y="112" width="278" height="270" rx="16" class="box task"/><text x="480" y="151" text-anchor="middle" class="label">Durable Job System</text><rect x="380" y="190" width="200" height="80" rx="12" class="box inner"/><text x="480" y="224" text-anchor="middle" class="label">Child Job</text><text x="480" y="250" text-anchor="middle" class="small">independent dispatch + retry</text>
  <rect x="644" y="112" width="278" height="270" rx="16" class="box flow"/><text x="783" y="151" text-anchor="middle" class="label">Workflow Controller</text><rect x="683" y="190" width="200" height="80" rx="12" class="box inner"/><text x="783" y="224" text-anchor="middle" class="label">Fanout + Join</text><text x="783" y="250" text-anchor="middle" class="small compact">explicit dependencies + join</text>
  <text x="177" y="329" text-anchor="middle" class="small">dynamic subproblem</text><text x="480" y="329" text-anchor="middle" class="small">job system converges state</text><text x="783" y="329" text-anchor="middle" class="small">deterministic control flow</text>
</svg>
