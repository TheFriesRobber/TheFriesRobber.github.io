<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">An explicit order for Hook composition</title>
  <desc id="desc">Trusted context enters Policy first. A Transformer renders the narrowed request, then an Observer wraps the model call, result normalization, and output policy to record the actual request and final result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#697386"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .heading { font-size: 18px; font-weight: 650; }
    .body { font-size: 14px; fill: #4b5563; }
    .box { stroke-width: 2; }
    .arrow { stroke: #697386; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="300" rx="18" fill="#fafafa"/>
  <text x="36" y="42" class="heading">Phases define authority and fact boundaries</text>
  <text x="36" y="68" class="body">Registration order should not change Tool visibility or tracing semantics</text>

  <rect x="38" y="112" width="150" height="92" rx="14" fill="#f2f3f5" stroke="#858b94" class="box"/>
  <text x="61" y="148" class="heading">Trusted context</text>
  <text x="65" y="177" class="body">identity · permission</text>

  <line x1="188" y1="158" x2="232" y2="158" class="arrow"/>
  <rect x="240" y="112" width="150" height="92" rx="14" fill="#fff0e5" stroke="#b56a32" class="box"/>
  <text x="286" y="148" class="heading">Policy</text>
  <text x="261" y="177" class="body">allow · deny · narrow</text>

  <line x1="390" y1="158" x2="434" y2="158" class="arrow"/>
  <rect x="442" y="112" width="150" height="92" rx="14" fill="#eaf2ff" stroke="#4b76b8" class="box"/>
  <text x="462" y="148" class="heading">Transformer</text>
  <text x="466" y="177" class="body">render approved input</text>

  <line x1="592" y1="158" x2="636" y2="158" class="arrow"/>
  <rect x="644" y="96" width="284" height="124" rx="16" fill="#f3eefe" stroke="#7655a8" class="box"/>
  <text x="665" y="126" class="body">Observer scope · record final request/result</text>
  <rect x="660" y="142" width="78" height="58" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="677" y="177" class="body">Model</text>
  <rect x="748" y="142" width="82" height="58" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="758" y="177" class="body">Normalize</text>
  <rect x="840" y="142" width="72" height="58" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="854" y="167" class="body">Output</text>
  <text x="855" y="185" class="body">policy</text>
</svg>
