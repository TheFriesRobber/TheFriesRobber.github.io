<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Steering Inbox admission and consumption boundaries</title>
  <desc id="desc">Input first passes through an admission gate. An open window durably stores it as pending before a Model Turn boundary marks it consumed; a closed window rejects it or routes it to a follow-up Run.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#4b5563}.edge{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.box{stroke-width:2}.input{fill:#fff4e8;stroke:#bc6b2c}.pending{fill:#eaf2ff;stroke:#4674bd}.turn{fill:#eef8f1;stroke:#43835a}.terminal{fill:#f3edff;stroke:#7652b2}</style></defs>
  <rect width="960" height="390" rx="18" fill="#fafafa"/><text x="38" y="48" class="title">Accepted does not mean included in model input</text><text x="38" y="76" class="small">Durable admission and Model Turn consumption must leave separate facts</text>
  <rect x="35" y="145" width="140" height="90" rx="14" class="box input"/><text x="105" y="184" text-anchor="middle" class="label">User Input</text><text x="105" y="211" text-anchor="middle" class="small">identity + input_id</text>
  <path d="M175 190H235" class="edge"/><rect x="235" y="130" width="175" height="120" rx="14" class="box terminal"/><text x="323" y="174" text-anchor="middle" class="label">Admission Gate</text><text x="323" y="203" text-anchor="middle" class="small">auth + open epoch?</text><text x="323" y="229" text-anchor="middle" class="small">allocate inbox_seq</text>
  <path d="M410 165H485" class="edge"/><text x="447" y="153" text-anchor="middle" class="small">open</text><rect x="485" y="115" width="185" height="120" rx="14" class="box pending"/><text x="578" y="158" text-anchor="middle" class="label">Durable Inbox</text><text x="578" y="188" text-anchor="middle" class="small">payload + pending</text><text x="578" y="214" text-anchor="middle" class="small">ordered by inbox_seq</text>
  <path d="M670 175H730" class="edge"/><rect x="730" y="120" width="195" height="110" rx="14" class="box turn"/><text x="828" y="163" text-anchor="middle" class="label">Model Turn Boundary</text><text x="828" y="192" text-anchor="middle" class="small">create Model Turn</text><text x="828" y="216" text-anchor="middle" class="small">mark consumed</text>
  <path d="M323 250V300H590" class="edge"/><text x="350" y="286" class="small">closed</text><rect x="590" y="270" width="250" height="72" rx="14" class="box terminal"/><text x="715" y="300" text-anchor="middle" class="label">Reject / Follow-up</text><text x="715" y="326" text-anchor="middle" class="small">not accepted by current Run</text>
</svg>
