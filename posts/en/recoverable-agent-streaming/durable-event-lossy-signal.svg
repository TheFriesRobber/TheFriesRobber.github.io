<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">How Durable Events and Lossy Signals divide responsibility</title>
  <desc id="desc">The Runtime commits to a durable log before sending a lossy signal. An online client receives updates in real time and uses a cursor to recover from the log after a disconnect.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#4b5563}.edge{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.box{stroke-width:2}.runtime{fill:#eef8f1;stroke:#43835a}.durable{fill:#eaf2ff;stroke:#4674bd}.signal{fill:#fff4e8;stroke:#bc6b2c}.client{fill:#f3edff;stroke:#7652b2}</style></defs>
  <rect width="960" height="400" rx="18" fill="#fafafa"/><text x="38" y="48" class="title">Signals Are Fast; the Event Log Makes Recovery Possible</text><text x="38" y="76" class="small">A client cursor is a recovery position, not a socket connection ID</text>
  <rect x="55" y="155" width="150" height="90" rx="14" class="box runtime"/><text x="130" y="195" text-anchor="middle" class="label">Runtime</text><text x="130" y="221" text-anchor="middle" class="small">commit first</text>
  <path d="M205 180H330" class="edge"/><rect x="330" y="120" width="210" height="100" rx="14" class="box durable"/><text x="435" y="160" text-anchor="middle" class="label">Durable Event Log</text><text x="435" y="190" text-anchor="middle" class="small">seq 27 · seq 28</text>
  <path d="M205 225H330" class="edge dash"/><rect x="330" y="250" width="210" height="82" rx="14" class="box signal"/><text x="435" y="285" text-anchor="middle" class="label">Lossy Signal</text><text x="435" y="310" text-anchor="middle" class="small">high_watermark=28</text>
  <path d="M540 291H710" class="edge dash"/><rect x="710" y="177" width="190" height="100" rx="14" class="box client"/><text x="805" y="217" text-anchor="middle" class="label">Client</text><text x="805" y="246" text-anchor="middle" class="small">cursor=26</text>
  <path d="M710 205C640 145 610 150 540 165" class="edge"/><text x="610" y="130" class="small">reconnect: read after 26</text>
</svg>
