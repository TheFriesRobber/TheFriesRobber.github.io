<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Model-facing Tool contract</title>
  <desc id="desc">用户意图先通过 Tool name 和 description 选择能力，再由 input schema 约束模型生成的业务参数。可信运行时另外注入身份、权限与审计上下文，handler 完成业务校验后才调用 backend。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737a76"/>
    </marker>
    <style>
      .title { font: 650 28px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171918; }
      .label { font: 650 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171918; }
      .small { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555c58; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #171918; }
      .edge { fill: none; stroke: #737a76; stroke-width: 2.2; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #c9cbc6; stroke-width: 2; }
      .model { fill: #edf2ff; stroke: #2457d6; stroke-width: 2; }
      .trusted { fill: #eef8f1; stroke: #3b8b57; stroke-width: 2; }
      .warning { fill: #fff7e8; stroke: #c58a22; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="18" fill="#fafaf9"/>
  <rect x="1" y="1" width="1198" height="648" rx="17" fill="none" stroke="#dedfdb" stroke-width="2"/>
  <text x="50" y="60" class="title">模型表达业务意图，运行时提供可信执行上下文</text>

  <rect x="50" y="105" width="210" height="100" rx="14" class="box"/>
  <text x="155" y="148" class="label" text-anchor="middle">用户请求</text>
  <text x="155" y="177" class="small" text-anchor="middle">自然语言意图</text>

  <path class="edge" d="M 260 155 L 330 155"/>

  <rect x="330" y="95" width="250" height="120" rx="14" class="model"/>
  <text x="455" y="137" class="label" text-anchor="middle">能力路由</text>
  <text x="455" y="169" class="mono" text-anchor="middle">name + description</text>
  <text x="455" y="195" class="small" text-anchor="middle">是否调用 · 调用哪个</text>

  <path class="edge" d="M 580 155 L 650 155"/>

  <rect x="650" y="95" width="250" height="120" rx="14" class="model"/>
  <text x="775" y="137" class="label" text-anchor="middle">参数生成</text>
  <text x="775" y="169" class="mono" text-anchor="middle">input schema</text>
  <text x="775" y="195" class="small" text-anchor="middle">最小充分业务输入</text>

  <path class="edge" d="M 900 155 L 970 155"/>

  <rect x="970" y="105" width="180" height="100" rx="14" class="warning"/>
  <text x="1060" y="145" class="label" text-anchor="middle">模型参数</text>
  <text x="1060" y="176" class="small" text-anchor="middle">不可信输入</text>

  <rect x="80" y="300" width="410" height="190" rx="14" class="trusted"/>
  <text x="110" y="340" class="label">Trusted runtime context</text>
  <text x="110" y="378" class="mono">authenticated_user_id</text>
  <text x="110" y="410" class="mono">permission_scope</text>
  <text x="110" y="442" class="mono">actor · request_id · timezone</text>
  <text x="110" y="472" class="small">不进入 model-facing schema</text>

  <rect x="650" y="300" width="220" height="190" rx="14" class="box"/>
  <text x="760" y="345" class="label" text-anchor="middle">Handler</text>
  <text x="760" y="383" class="small" text-anchor="middle">schema validation</text>
  <text x="760" y="415" class="small" text-anchor="middle">business validation</text>
  <text x="760" y="447" class="small" text-anchor="middle">policy + error envelope</text>

  <rect x="950" y="300" width="200" height="190" rx="14" class="box"/>
  <text x="1050" y="345" class="label" text-anchor="middle">Backend</text>
  <text x="1050" y="383" class="small" text-anchor="middle">authorization</text>
  <text x="1050" y="415" class="small" text-anchor="middle">transaction</text>
  <text x="1050" y="447" class="small" text-anchor="middle">idempotency · audit</text>

  <path class="edge" d="M 1060 205 C 1060 255 865 250 820 300"/>
  <path class="edge" d="M 490 395 L 640 395"/>
  <path class="edge" d="M 870 395 L 940 395"/>

  <rect x="80" y="545" width="1070" height="62" rx="12" fill="#ffffff" stroke="#dedfdb" stroke-width="2"/>
  <text x="615" y="584" class="small" text-anchor="middle">Schema 缩小模型可表达的输入；最终权限与一致性仍由 handler、backend 和 storage 保证。</text>
</svg>
