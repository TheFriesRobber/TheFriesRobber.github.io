<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Spark hot key salting</title>
  <desc id="desc">Comparison of a hot key concentrated in one physical partition before salting and assigned to four salt buckets afterward, creating multiple partitioning keys without implying a one-to-one mapping to physical partitions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737a76"/>
    </marker>
    <style>
      .label { font: 600 25px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171918; }
      .small { font: 500 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5350; }
      .tiny { font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #737a76; }
      .mono { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #171918; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#fafaf9"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#dedfdb" stroke-width="2"/>
  <text x="50" y="58" class="label">同一个 hot key：加盐前后</text>
  <line x1="600" y1="92" x2="600" y2="660" stroke="#dedfdb" stroke-width="2"/>

  <text x="50" y="125" class="label">未加盐</text>
  <text x="650" y="125" class="label">只对 hot key 加盐</text>

  <text x="50" y="170" class="small">输入记录</text>
  <g transform="translate(50 190)">
    <g fill="#fff3ef" stroke="#d46b45" stroke-width="2">
      <rect x="0" y="0" width="52" height="42" rx="7"/><rect x="60" y="0" width="52" height="42" rx="7"/>
      <rect x="120" y="0" width="52" height="42" rx="7"/><rect x="180" y="0" width="52" height="42" rx="7"/>
      <rect x="240" y="0" width="52" height="42" rx="7"/>
    </g>
    <rect x="300" y="0" width="52" height="42" rx="7" fill="#edf2ff" stroke="#2457d6" stroke-width="2"/>
    <rect x="360" y="0" width="52" height="42" rx="7" fill="#edf2ff" stroke="#2457d6" stroke-width="2"/>
    <g class="mono" text-anchor="middle">
      <text x="26" y="28">A</text><text x="86" y="28">A</text><text x="146" y="28">A</text>
      <text x="206" y="28">A</text><text x="266" y="28">A</text><text x="326" y="28">B</text><text x="386" y="28">C</text>
    </g>
  </g>
  <path d="M 255 252 L 255 302" stroke="#737a76" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="273" y="285" class="tiny">hash(key)</text>

  <g transform="translate(50 325)">
    <text x="0" y="30" class="mono">P0</text><rect x="55" y="0" width="350" height="50" rx="8" fill="#ffffff" stroke="#c9cbc6" stroke-width="2"/>
    <rect x="70" y="11" width="40" height="28" rx="5" fill="#edf2ff"/><text x="90" y="31" class="mono" text-anchor="middle">B</text>
    <text x="0" y="100" class="mono">P1</text><rect x="55" y="70" width="350" height="50" rx="8" fill="#ffffff" stroke="#c9cbc6" stroke-width="2"/>
    <rect x="70" y="81" width="40" height="28" rx="5" fill="#edf2ff"/><text x="90" y="101" class="mono" text-anchor="middle">C</text>
    <text x="0" y="170" class="mono">P2</text><rect x="55" y="140" width="430" height="50" rx="8" fill="#fff3ef" stroke="#d46b45" stroke-width="2"/>
    <g fill="#f7d8cc"><rect x="70" y="151" width="40" height="28" rx="5"/><rect x="117" y="151" width="40" height="28" rx="5"/><rect x="164" y="151" width="40" height="28" rx="5"/><rect x="211" y="151" width="40" height="28" rx="5"/><rect x="258" y="151" width="40" height="28" rx="5"/></g>
    <g class="mono" text-anchor="middle"><text x="90" y="171">A</text><text x="137" y="171">A</text><text x="184" y="171">A</text><text x="231" y="171">A</text><text x="278" y="171">A</text></g>
    <text x="315" y="171" class="small" fill="#a84d2f">长尾 task</text>
  </g>
  <rect x="50" y="570" width="500" height="84" rx="10" fill="#fff3ef" stroke="#e7b29e"/>
  <text x="72" y="605" class="small">同一个 key 仍然只有一个 hash 值，</text>
  <text x="72" y="635" class="small">仅增加 partition 数不会拆开 A。</text>

  <text x="650" y="170" class="small">事实表：5 条 A 分配到 4 个 salt bucket</text>
  <g transform="translate(650 190)">
    <g fill="#edf2ff" stroke="#2457d6" stroke-width="2">
      <rect x="0" y="0" width="58" height="42" rx="7"/><rect x="66" y="0" width="58" height="42" rx="7"/>
      <rect x="132" y="0" width="58" height="42" rx="7"/><rect x="198" y="0" width="58" height="42" rx="7"/>
      <rect x="264" y="0" width="58" height="42" rx="7"/>
    </g>
    <g class="mono" text-anchor="middle"><text x="29" y="28">A,0</text><text x="95" y="28">A,1</text><text x="161" y="28">A,2</text><text x="227" y="28">A,3</text><text x="293" y="28">A,0</text></g>
  </g>
  <path d="M 810 252 L 810 302" stroke="#737a76" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="828" y="285" class="tiny">按 salt 分桶</text>

  <g transform="translate(650 325)">
    <g class="mono">
      <text x="0" y="30">S0</text><text x="0" y="90">S1</text><text x="0" y="150">S2</text><text x="0" y="210">S3</text>
    </g>
    <g fill="#ffffff" stroke="#c9cbc6" stroke-width="2">
      <rect x="55" y="0" width="430" height="44" rx="8"/><rect x="55" y="60" width="430" height="44" rx="8"/>
      <rect x="55" y="120" width="430" height="44" rx="8"/><rect x="55" y="180" width="430" height="44" rx="8"/>
    </g>
    <g fill="#edf2ff">
      <rect x="70" y="8" width="58" height="28" rx="5"/><rect x="70" y="68" width="58" height="28" rx="5"/>
      <rect x="70" y="128" width="58" height="28" rx="5"/><rect x="70" y="188" width="58" height="28" rx="5"/>
      <rect x="136" y="8" width="58" height="28" rx="5"/>
    </g>
    <g class="mono" text-anchor="middle"><text x="99" y="29">A,0</text><text x="165" y="29">A,0</text><text x="99" y="89">A,1</text><text x="99" y="149">A,2</text><text x="99" y="209">A,3</text></g>
  </g>
  <rect x="650" y="585" width="500" height="69" rx="10" fill="#edf2ff" stroke="#b9caf6"/>
  <text x="672" y="613" class="small">一个 key 变成多个 partitioning key，通常可分散负载；</text>
  <text x="672" y="640" class="small">bucket 与 physical partition 并非一一对应。</text>
</svg>
