<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">长对话的增量压缩与 Checkpoint</title>
  <desc id="desc">原始记录按 event sequence 排列，较早的稳定区间被 summary 覆盖，最近区间作为原始窗口保留。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20242b; }
    .label { font-size: 28px; font-weight: 650; }
    .small { font-size: 21px; fill: #4d5665; }
    .raw { fill: #eef3fb; stroke: #4c76b8; stroke-width: 3; }
    .summary { fill: #f5efff; stroke: #7a58b3; stroke-width: 3; }
    .recent { fill: #eef8f0; stroke: #4e875c; stroke-width: 3; }
    .arrow { stroke: #697386; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#697386"/>
    </marker>
  </defs>
  <text x="55" y="55" class="label">Raw history 按保留与授权策略保存</text>
  <rect x="55" y="90" width="295" height="82" rx="14" class="raw"/>
  <rect x="350" y="90" width="350" height="82" rx="14" class="raw"/>
  <rect x="700" y="90" width="445" height="82" rx="14" class="recent"/>
  <text x="90" y="140" class="small">covered by summary_2</text>
  <text x="435" y="140" class="small">stable raw prefix</text>
  <text x="765" y="140" class="small">recent events &gt; checkpoint_seq</text>
  <path d="M 200 180 C 200 225, 270 225, 270 260" class="arrow"/>
  <path d="M 525 180 C 525 225, 470 225, 470 260" class="arrow"/>
  <rect x="130" y="270" width="450" height="88" rx="14" class="summary"/>
  <text x="172" y="307" class="label">summary_2 → summary_3</text>
  <text x="183" y="340" class="small">覆盖水位推进到 checkpoint_seq</text>
  <path d="M 580 314 L 725 314" class="arrow"/>
  <rect x="745" y="270" width="360" height="88" rx="14" class="recent"/>
  <text x="790" y="307" class="label">Model Turn Context view</text>
  <text x="780" y="340" class="small">summary_3 + recent raw events</text>
  <text x="55" y="410" class="small">压缩本身不删除原始记录；来源失效时，关联 summary 也必须失效。</text>
</svg>
