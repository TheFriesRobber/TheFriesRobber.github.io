<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">用户更正触发 summary 重建的时序</title>
  <desc id="desc">用户更正以新 event 写入原始历史。Context Assembly 请求并读取旧 summary 与更正，判断当前 Run 采用的内容和适用范围。更正需要影响后续对话时，Compression 读取受影响来源、生成 summary 4，并尝试切换 active checkpoint；成功并复验授权后才调用模型，重建失败时当前 Run 以 state failed、failure reason context needs rebuild 结束且不调用模型。只在当前 Run 生效的更正由 Assembly 直接生成 current-only Context view，不重建 summary。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #20242b; }
    .participant { font-size: 21px; font-weight: 650; }
    .message { font-size: 19px; fill: #394150; }
    .small { font-size: 17px; fill: #4d5665; }
    .tiny { font-size: 15px; fill: #4d5665; }
    .branch-label { font-size: 20px; font-weight: 650; }
    .decision-title { font-size: 21px; font-weight: 650; fill: #5f3e93; }
    .decision-text { font-size: 18px; fill: #4d5665; }
    .lane { stroke: #98a2b3; stroke-width: 2; stroke-dasharray: 8 8; }
    .arrow { stroke: #596579; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .self-arrow { stroke: #7a58b3; stroke-width: 2.5; fill: none; marker-end: url(#arrow-purple); }
    .divider { stroke: #aeb7c4; stroke-width: 2; stroke-dasharray: 10 7; }
    .actor { fill: #eef3fb; stroke: #4c76b8; stroke-width: 2.5; }
    .raw { fill: #eef8f0; stroke: #4e875c; stroke-width: 2.5; }
    .assembly { fill: #f5efff; stroke: #7a58b3; stroke-width: 2.5; }
    .compression { fill: #fff6df; stroke: #b27a19; stroke-width: 2.5; }
    .checkpoint { fill: #edf6ff; stroke: #3273a8; stroke-width: 2.5; }
    .model { fill: #f1f3f5; stroke: #68717d; stroke-width: 2.5; }
    .outer-branch { fill: #fbfcfe; stroke: #aeb7c4; stroke-width: 2; }
    .inner-branch { fill: #ffffff; stroke: #cbd2dc; stroke-width: 2; }
    .failure-note { fill: #fff1f0; stroke: #c65050; stroke-width: 2; }
    .temporary-note { fill: #eef8f0; stroke: #4e875c; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#596579"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a58b3"/>
    </marker>
  </defs>

  <rect x="30" y="30" width="200" height="70" rx="12" class="actor"/>
  <rect x="300" y="30" width="200" height="70" rx="12" class="raw"/>
  <rect x="580" y="30" width="200" height="70" rx="12" class="assembly"/>
  <rect x="860" y="30" width="200" height="70" rx="12" class="compression"/>
  <rect x="1130" y="30" width="200" height="70" rx="12" class="checkpoint"/>
  <rect x="1400" y="30" width="170" height="70" rx="12" class="model"/>
  <text x="130" y="72" text-anchor="middle" class="participant">用户</text>
  <text x="400" y="72" text-anchor="middle" class="participant">Raw history</text>
  <text x="680" y="58" text-anchor="middle" class="participant">Context</text>
  <text x="680" y="83" text-anchor="middle" class="participant">Assembly</text>
  <text x="960" y="72" text-anchor="middle" class="participant">Compression</text>
  <text x="1230" y="58" text-anchor="middle" class="participant">Active</text>
  <text x="1230" y="83" text-anchor="middle" class="participant">checkpoint</text>
  <text x="1485" y="72" text-anchor="middle" class="participant">Model</text>

  <line x1="130" y1="100" x2="130" y2="1460" class="lane"/>
  <line x1="400" y1="100" x2="400" y2="1460" class="lane"/>
  <line x1="680" y1="100" x2="680" y2="1460" class="lane"/>
  <line x1="960" y1="100" x2="960" y2="1460" class="lane"/>
  <line x1="1230" y1="100" x2="1230" y2="1460" class="lane"/>
  <line x1="1485" y1="100" x2="1485" y2="1460" class="lane"/>

  <path d="M 130 190 L 400 190" class="arrow"/>
  <text x="265" y="137" text-anchor="middle" class="message">append user.correction</text>
  <text x="265" y="158" text-anchor="middle" class="tiny">event_seq: correction_seq</text>
  <text x="265" y="178" text-anchor="middle" class="tiny">message_id: msg_scope_correction</text>

  <path d="M 680 235 L 1230 235" class="arrow"/>
  <text x="955" y="222" text-anchor="middle" class="message">read active checkpoint</text>
  <path d="M 1230 285 L 680 285" class="arrow"/>
  <text x="955" y="272" text-anchor="middle" class="message">summary_3 + covers + provenance</text>

  <path d="M 680 350 L 400 350" class="arrow"/>
  <text x="540" y="337" text-anchor="middle" class="message">read correction_seq</text>
  <path d="M 400 400 L 680 400" class="arrow"/>
  <text x="540" y="387" text-anchor="middle" class="message">更正原文 + message_id</text>

  <path d="M 680 445 h 115 v 62 h -115" class="self-arrow"/>
  <text x="820" y="455" class="decision-title">Assembly Decision</text>
  <text x="820" y="483" class="decision-text">当前 Run 采用欧洲；判断更正是否影响后续对话</text>

  <rect x="60" y="530" width="1480" height="920" rx="16" class="outer-branch"/>
  <rect x="60" y="530" width="320" height="42" rx="16" class="assembly"/>
  <text x="220" y="558" text-anchor="middle" class="branch-label">alt 影响后续：重建 summary</text>

  <path d="M 680 615 L 960 615" class="arrow"/>
  <text x="820" y="602" text-anchor="middle" class="message">rebuild(summary_3, decision_ref)</text>

  <path d="M 960 675 L 400 675" class="arrow"/>
  <text x="680" y="662" text-anchor="middle" class="message">read 获授权且仍可用的受影响来源</text>
  <path d="M 400 725 L 960 725" class="arrow"/>
  <text x="680" y="712" text-anchor="middle" class="message">受影响记录 + provenance + 授权/保留版本</text>

  <path d="M 960 755 h 150 v 70 h -150" class="arrow"/>
  <text x="1130" y="770" class="message">生成并完整校验 summary_4</text>
  <text x="1130" y="797" class="small">covers 至 checkpoint_seq</text>
  <text x="1130" y="819" class="small">完整 dependencies：decision + source + backlink</text>

  <rect x="85" y="850" width="1430" height="450" rx="14" class="inner-branch"/>
  <rect x="85" y="850" width="385" height="38" rx="14" class="checkpoint"/>
  <text x="277" y="876" text-anchor="middle" class="branch-label">alt 校验成功，并且 CAS 成功</text>

  <path d="M 960 915 L 1230 915" class="arrow"/>
  <text x="1095" y="880" text-anchor="middle" class="small">CAS 绑定 active version + raw/event watermark</text>
  <text x="1095" y="902" text-anchor="middle" class="small">+ authorization/retention revision</text>
  <path d="M 1230 955 L 960 955" class="arrow"/>
  <text x="1095" y="942" text-anchor="middle" class="message">active = summary_4</text>
  <path d="M 960 995 L 680 995" class="arrow"/>
  <text x="820" y="982" text-anchor="middle" class="message">返回新的 active checkpoint</text>
  <path d="M 680 1035 L 1485 1035" class="arrow"/>
  <text x="1082" y="1022" text-anchor="middle" class="message">复验授权/保留版本后，渲染 summary_4 + recent window</text>

  <line x1="85" y1="1060" x2="1515" y2="1060" class="divider"/>
  <rect x="85" y="1060" width="385" height="38" rx="14" class="failure-note"/>
  <text x="277" y="1086" text-anchor="middle" class="branch-label">else CAS 冲突：重读并重建</text>
  <path d="M 960 1120 L 1230 1120" class="arrow"/>
  <text x="1095" y="1107" text-anchor="middle" class="message">compare-and-switch</text>
  <path d="M 1230 1160 L 960 1160" class="arrow"/>
  <text x="1095" y="1147" text-anchor="middle" class="message">conflict</text>
  <path d="M 960 1200 L 680 1200" class="arrow"/>
  <text x="820" y="1187" text-anchor="middle" class="message">返回 conflict；重新读取并生成</text>
  <text x="1090" y="1207" class="small">重试耗尽：结束 Run（context_needs_rebuild）</text>

  <line x1="85" y1="1230" x2="1515" y2="1230" class="divider"/>
  <rect x="85" y="1230" width="330" height="38" rx="14" class="failure-note"/>
  <text x="250" y="1256" text-anchor="middle" class="branch-label">else 生成或校验失败</text>
  <path d="M 960 1280 L 680 1280" class="arrow"/>
  <text x="820" y="1267" text-anchor="middle" class="message">结束当前 Run（context_needs_rebuild）</text>
  <text x="1090" y="1287" class="small">不切换 Active checkpoint；不调用 Model</text>

  <line x1="60" y1="1320" x2="1540" y2="1320" class="divider"/>
  <rect x="60" y="1320" width="300" height="42" rx="16" class="temporary-note"/>
  <text x="210" y="1348" text-anchor="middle" class="branch-label">else 当前 Run 只隐藏北美</text>
  <path d="M 680 1400 L 1485 1400" class="arrow"/>
  <text x="1082" y="1387" text-anchor="middle" class="message">渲染 current-only 派生 Context view</text>
  <text x="820" y="1435" class="small">summary_3 保持不变；Compression 与 Active checkpoint 无变化</text>
</svg>
