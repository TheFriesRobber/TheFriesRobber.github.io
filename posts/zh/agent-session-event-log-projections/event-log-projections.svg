<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Session Event Log 与多个 Projection</title>
  <desc id="desc">Runtime 只向 Session Event Log 追加事实，消息视图、Run 状态、实时通知和指标分别由 projector 生成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:15px;fill:#4b5563}.edge{stroke:#6b7280;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.box{stroke-width:2}.runtime{fill:#eef8f1;stroke:#43835a}.log{fill:#eaf2ff;stroke:#4674bd}.view{fill:#fff;stroke:#8a9099}</style>
  </defs>
  <rect width="960" height="420" rx="18" fill="#fafafa"/>
  <text x="38" y="48" class="title">事实只追加一次，视图可以重建</text>
  <text x="38" y="76" class="small">Projection 失败不会触发模型或 Tool 重新执行</text>
  <rect x="50" y="152" width="150" height="90" rx="14" class="box runtime"/>
  <text x="125" y="190" text-anchor="middle" class="label">Runtime</text>
  <text x="125" y="217" text-anchor="middle" class="small">append event</text>
  <path d="M200 197H300" class="edge"/>
  <rect x="300" y="122" width="230" height="150" rx="16" class="box log"/>
  <text x="415" y="165" text-anchor="middle" class="label">Session Event Log</text>
  <text x="415" y="198" text-anchor="middle" class="small">session_id + seq</text>
  <text x="415" y="225" text-anchor="middle" class="small">append-only facts</text>
  <path d="M530 197H580V135H635" class="edge"/><path d="M530 197H580V205H635" class="edge"/><path d="M530 197H580V275H635" class="edge"/><path d="M530 197H580V345H635" class="edge"/>
  <rect x="635" y="105" width="260" height="60" rx="12" class="box view"/><text x="765" y="141" text-anchor="middle" class="label">Message View</text>
  <rect x="635" y="175" width="260" height="60" rx="12" class="box view"/><text x="765" y="211" text-anchor="middle" class="label">Run Snapshot</text>
  <rect x="635" y="245" width="260" height="60" rx="12" class="box view"/><text x="765" y="281" text-anchor="middle" class="label">Realtime Signal</text>
  <rect x="635" y="315" width="260" height="60" rx="12" class="box view"/><text x="765" y="351" text-anchor="middle" class="label">Metrics / Audit</text>
</svg>
