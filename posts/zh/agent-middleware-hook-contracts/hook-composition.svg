<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Hook composition 的明确执行顺序</title>
  <desc id="desc">可信上下文先进入 Policy，收窄后的请求由 Transformer 渲染，Observer 随后围绕模型调用、结果归一化与输出策略记录实际请求与最终结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#697386"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .heading { font-size: 18px; font-weight: 650; }
    .body { font-size: 14px; fill: #4b5563; }
    .phase-heading { font-size: 16px; font-weight: 650; }
    .phase-detail { font-size: 13px; fill: #4b5563; }
    .observer-label { font-size: 14px; font-weight: 600; fill: #4b5563; }
    .observer-detail { font-size: 12px; fill: #4b5563; }
    .box { stroke-width: 2; }
    .arrow { stroke: #697386; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="300" rx="18" fill="#fafafa"/>
  <text x="36" y="42" class="heading">Phase 决定权限与事实边界</text>
  <text x="36" y="68" class="body">注册顺序不应改变 Tool 可见性或 tracing 口径</text>

  <rect x="38" y="112" width="150" height="92" rx="14" fill="#f2f3f5" stroke="#858b94" class="box"/>
  <text x="113" y="148" text-anchor="middle" class="phase-heading">Trusted context</text>
  <text x="113" y="177" text-anchor="middle" class="phase-detail">identity · permission</text>

  <line x1="188" y1="158" x2="232" y2="158" class="arrow"/>
  <rect x="240" y="112" width="150" height="92" rx="14" fill="#fff0e5" stroke="#b56a32" class="box"/>
  <text x="315" y="148" text-anchor="middle" class="phase-heading">Policy</text>
  <text x="315" y="177" text-anchor="middle" class="phase-detail">allow · deny · narrow</text>

  <line x1="390" y1="158" x2="434" y2="158" class="arrow"/>
  <rect x="442" y="112" width="150" height="92" rx="14" fill="#eaf2ff" stroke="#4b76b8" class="box"/>
  <text x="517" y="148" text-anchor="middle" class="phase-heading">Transformer</text>
  <text x="517" y="172" text-anchor="middle" class="phase-detail">render approved</text>
  <text x="517" y="190" text-anchor="middle" class="phase-detail">input</text>

  <line x1="592" y1="158" x2="636" y2="158" class="arrow"/>
  <rect x="644" y="96" width="284" height="124" rx="16" fill="#f3eefe" stroke="#7655a8" class="box"/>
  <text x="665" y="119" class="observer-label">Observer 范围</text>
  <text x="665" y="137" class="observer-detail">最终请求 · 归一化结果</text>
  <rect x="660" y="148" width="78" height="54" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="699" y="180" text-anchor="middle" class="body">Model</text>
  <rect x="748" y="148" width="82" height="54" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="789" y="180" text-anchor="middle" class="body">Normalize</text>
  <rect x="840" y="148" width="72" height="54" rx="10" fill="#e9f6ec" stroke="#4a8358" class="box"/>
  <text x="876" y="172" text-anchor="middle" class="body">Output</text>
  <text x="876" y="189" text-anchor="middle" class="body">policy</text>

</svg>
