<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Session、Task、Run 与 Job 的身份关系</title>
  <desc id="desc">Session 是共享上下文范围，其中可关联多个 Task。报告 Task 关联两个 Run 和一个 Job；第一个 Run 内包含 Model Turn 与 Tool Execution。右侧列出这些对象在同一时刻的不同状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
    .heading { font-size: 22px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .small { font-size: 14px; fill: #4b5563; }
    .tiny { font-size: 12px; fill: #4b5563; }
    .session { fill: #f7f7f8; stroke: #6b7280; stroke-width: 2; }
    .task { fill: #fffaf0; stroke: #a66b00; stroke-width: 2; stroke-dasharray: 7 5; }
    .run { fill: #f0f7f2; stroke: #3f7d52; stroke-width: 2; }
    .job { fill: #eef4ff; stroke: #3c6fb6; stroke-width: 2; }
    .secondary { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .state { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .flow { fill: none; stroke: #6b7280; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="700" rx="18" fill="#fafafa"/>
  <text x="34" y="42" class="heading">先看身份关系，再看各自状态</text>
  <text x="34" y="68" class="small">外层框表示共享范围或目标关联，不表示共享同一个 status</text>

  <rect x="34" y="94" width="730" height="560" rx="16" class="session"/>
  <text x="56" y="126" class="label">Session session_3</text>
  <text x="220" y="126" class="small">共享对话、Context 与资源范围</text>

  <rect x="64" y="148" width="670" height="408" rx="14" class="task"/>
  <text x="86" y="180" class="label">Task task_report_7</text>
  <text x="274" y="180" class="small">目标：生成并交付 PDF</text>

  <rect x="92" y="204" width="390" height="306" rx="13" class="run"/>
  <text x="114" y="236" class="label">Run run_18 · 初始请求</text>
  <text x="114" y="261" class="small">一次 Agent Loop</text>

  <rect x="118" y="274" width="152" height="48" rx="9" class="secondary"/>
  <text x="136" y="295" class="small">Model Turn 1</text>
  <text x="136" y="313" class="tiny">提出 read_file</text>
  <rect x="302" y="274" width="152" height="48" rx="9" class="secondary"/>
  <text x="320" y="295" class="small">Tool Execution</text>
  <text x="320" y="313" class="tiny">read_file · done</text>

  <rect x="118" y="332" width="152" height="48" rx="9" class="secondary"/>
  <text x="136" y="353" class="small">Model Turn 2</text>
  <text x="136" y="371" class="tiny">生成报告并提出保存</text>
  <rect x="302" y="332" width="152" height="48" rx="9" class="secondary"/>
  <text x="320" y="353" class="small">Tool Execution</text>
  <text x="320" y="371" class="tiny">save_report · done</text>

  <rect x="118" y="390" width="152" height="48" rx="9" class="secondary"/>
  <text x="136" y="411" class="small">Model Turn 3</text>
  <text x="136" y="429" class="tiny">提出转换</text>
  <rect x="302" y="390" width="152" height="48" rx="9" class="secondary"/>
  <text x="320" y="411" class="small">Tool Execution</text>
  <text x="320" y="429" class="tiny">enqueue · done</text>

  <rect x="118" y="448" width="336" height="46" rx="9" class="secondary"/>
  <text x="136" y="477" class="small">Model Turn 4 · 回复“报告正在转换”</text>

  <rect x="520" y="244" width="184" height="104" rx="12" class="job"/>
  <text x="540" y="273" class="label">Job job_pdf_9</text>
  <text x="540" y="298" class="small">调度系统拥有状态</text>
  <text x="540" y="322" class="tiny">转换 report.md@v3</text>
  <path d="M454 414 C500 414 490 327 518 315" class="flow"/>

  <rect x="520" y="382" width="184" height="86" rx="12" class="run"/>
  <text x="540" y="411" class="label">Run run_19</text>
  <text x="540" y="436" class="small">新输入：查询进度</text>
  <text x="540" y="457" class="tiny">读取 Task / Job 状态</text>

  <rect x="64" y="578" width="352" height="54" rx="11" class="task"/>
  <text x="84" y="610" class="label">另一个 Task：把报告发给我</text>

  <rect x="790" y="94" width="276" height="560" rx="16" class="state"/>
  <text x="812" y="128" class="label">同一时刻的状态</text>
  <text x="812" y="161" class="small">彼此可以不同：</text>

  <rect x="812" y="188" width="232" height="52" rx="10" class="secondary"/>
  <text x="830" y="220" class="small">Session → active</text>
  <rect x="812" y="256" width="232" height="52" rx="10" class="secondary"/>
  <text x="830" y="288" class="small">Task → waiting</text>
  <rect x="812" y="324" width="232" height="52" rx="10" class="secondary"/>
  <text x="830" y="356" class="small">Run 18 → succeeded</text>
  <rect x="812" y="392" width="232" height="52" rx="10" class="secondary"/>
  <text x="830" y="424" class="small">Job → running</text>
  <rect x="812" y="460" width="232" height="52" rx="10" class="secondary"/>
  <text x="830" y="492" class="small">Run 19 → succeeded</text>

  <text x="812" y="548" class="small">PDF → artifact_ready</text>
  <text x="812" y="574" class="tiny">Task owner 提交交付后</text>
  <text x="812" y="604" class="label">Task → succeeded</text>
</svg>
